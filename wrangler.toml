name = "self-hosted-cloud-drive"
main = "cloudflare/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# -------------------------------------------------------------
# Static Assets: Automatically hosts frontend/index.html & share.html
# -------------------------------------------------------------
[assets]
directory = "frontend"
binding = "ASSETS"

# -------------------------------------------------------------
# Cloudflare D1 (SQLite Database)
# -------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "qr-relay-db"
database_id = "0b63031a-3432-4d0b-83e5-ac9a1168e876"

# -------------------------------------------------------------
# Cloudflare R2 (Object Storage for files and images)
# -------------------------------------------------------------
[[r2_buckets]]
binding = "qr-relay-files"
bucket_name = "qr-relay-files"

# -------------------------------------------------------------
# Cron Trigger: Background physical file and DB expiration cleanup
# -------------------------------------------------------------
[triggers]
crons = ["*/10 * * * *"]

# -------------------------------------------------------------
# Environment Variables & Default Config
# -------------------------------------------------------------
[vars]
APP_NAME = "QR-Relay"
MAX_FILE_SIZE_MB = "100"
MAX_TOTAL_STORAGE_GB = "10"
ADMIN_PASSWORD = "admin123"

# -------------------------------------------------------------
# Optional: R2 Direct Upload for >100MB files (up to 5GB)
# 【推荐】直接在网页【系统设置】(管理员模式) 中填写并永久存入 D1 数据库，永不丢失！
# 如需通过 Cloudflare 控制台配置，请在 [Worker 设置] -> [变量与机密] 中添加机密 (Secrets) 或变量：
# CF_ACCOUNT_ID = "your-account-id"
# R2_ACCESS_KEY_ID = "your-r2-access-key-id"
# R2_SECRET_ACCESS_KEY = "your-r2-secret-access-key"
# -------------------------------------------------------------
